<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="The same drop. A different meaning." data-scene="relative"><style>text{font-family:Arial,sans-serif}text[font-family]{font-family:Georgia,serif}</style><rect x="0" y="0" width="1920" height="1080" fill="#0b0f14"></rect><text x="120" y="87" font-size="23" fill="#98a8b7" text-anchor="start">FEATURE ENGINEERING / 02</text><text x="120" y="174" font-size="62" fill="#e8eef1" text-anchor="start" font-family="Georgia,serif" data-fit="1420">The same drop. A different meaning.</text><text x="120" y="245" font-size="27" fill="#98a8b7" text-anchor="start" data-fit="1410">Illustrative values—not observed customer measurements.</text><text x="180" y="330" font-size="29" fill="#98a8b7" text-anchor="start">Customer A</text><line x1="180" y1="675" x2="730" y2="675" stroke="#30404d" stroke-width="2"></line><rect x="235" y="395" width="130" height="280" fill="#76aafa" opacity=".55"></rect><text x="300" y="720" font-size="27" fill="#98a8b7" text-anchor="middle">Prior mean</text><text x="300" y="373" font-size="32" fill="#76aafa" text-anchor="middle">100</text><g opacity="1" transform="translate(0 0)"><rect x="460" y="451" width="130" height="224" fill="#70d4bc"></rect><text x="525" y="720" font-size="27" fill="#98a8b7" text-anchor="middle">Current</text><text x="525" y="429" font-size="32" fill="#70d4bc" text-anchor="middle">80</text></g><g opacity="1" transform="translate(0 0)"><text x="415" y="792" font-size="29" fill="#98a8b7" text-anchor="middle">Same absolute change: −20</text></g><g opacity="1" transform="translate(0 0)"><text x="765" y="555" font-size="60" fill="#70d4bc" text-anchor="middle" font-family="Georgia,serif">−20%</text></g><text x="990" y="330" font-size="29" fill="#98a8b7" text-anchor="start">Customer B</text><line x1="990" y1="675" x2="1540" y2="675" stroke="#30404d" stroke-width="2"></line><rect x="1045" y="395" width="130" height="280" fill="#76aafa" opacity=".55"></rect><text x="1110" y="720" font-size="27" fill="#98a8b7" text-anchor="middle">Prior mean</text><text x="1110" y="373" font-size="32" fill="#76aafa" text-anchor="middle">1000</text><g opacity="1" transform="translate(0 0)"><rect x="1270" y="400.59999999999997" width="130" height="274.40000000000003" fill="#70d4bc"></rect><text x="1335" y="720" font-size="27" fill="#98a8b7" text-anchor="middle">Current</text><text x="1335" y="378.59999999999997" font-size="32" fill="#70d4bc" text-anchor="middle">980</text></g><g opacity="1" transform="translate(0 0)"><text x="1225" y="792" font-size="29" fill="#98a8b7" text-anchor="middle">Same absolute change: −20</text></g><g opacity="1" transform="translate(0 0)"><text x="1575" y="555" font-size="60" fill="#70d4bc" text-anchor="middle" font-family="Georgia,serif">−2%</text></g><g opacity="1" transform="translate(0 0)"><text x="120" y="839" font-size="26" fill="#98a8b7" text-anchor="start">Relative = clip((current − prior mean) / max(|prior mean|, 1), −10, 10)</text></g><line x1="120" y1="866" x2="1790" y2="866" stroke="#30404d" stroke-width="2"></line><text x="120" y="917" font-size="34" fill="#e8eef1" text-anchor="start" data-fit="1660">Compare today with that customer’s own recent history.</text></svg>