<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="What worked. What needs another test." data-scene="decision"><style>text{font-family:Arial,sans-serif}text[font-family]{font-family:Georgia,serif}</style><rect x="0" y="0" width="1920" height="1080" fill="#0b0f14"></rect><text x="120" y="87" font-size="23" fill="#98a8b7" text-anchor="start">FEATURE ENGINEERING / 06</text><text x="120" y="174" font-size="62" fill="#e8eef1" text-anchor="start" font-family="Georgia,serif" data-fit="1420">What worked. What needs another test.</text><text x="120" y="245" font-size="27" fill="#98a8b7" text-anchor="start" data-fit="1410">Different evidence supports different conclusions.</text><g opacity="1" transform="translate(0 0)"><text x="120" y="369" font-size="24" fill="#70d4bc" text-anchor="start">STRONGEST CONTROLLED-SCREEN ADDITION</text><text x="120" y="435" font-size="57" fill="#70d4bc" text-anchor="start" font-family="Georgia,serif">Relative balance + payroll</text></g><g opacity="1" transform="translate(0 0)"><text x="120" y="518" font-size="29" fill="#98a8b7" text-anchor="start">Mean Δ AUC</text><text x="405" y="520" font-size="39" fill="#e8eef1" text-anchor="start">+0.001456</text><text x="850" y="520" font-size="31" fill="#98a8b7" text-anchor="start">4 added columns</text></g><line x1="120" y1="565" x2="1760" y2="565" stroke="#30404d" stroke-width="2"></line><g opacity="1" transform="translate(0 0)"><text x="120" y="633" font-size="24" fill="#76aafa" text-anchor="start">FOLLOW-UP CANDIDATES</text><text x="120" y="692" font-size="39" fill="#e8eef1" text-anchor="start">Longer funds history + usage changes</text><text x="120" y="744" font-size="29" fill="#98a8b7" text-anchor="start">Historical evidence only. EMA remains exploratory.</text></g><g opacity="1" transform="translate(0 0)"><text x="120" y="824" font-size="29" fill="#98a8b7" text-anchor="start">Test additions separately; do not assign a full recipe’s score to one feature.</text></g><line x1="120" y1="866" x2="1790" y2="866" stroke="#30404d" stroke-width="2"></line><text x="120" y="917" font-size="34" fill="#e8eef1" text-anchor="start" data-fit="1660">Best in this screen ≠ proven best feature in every model.</text></svg>