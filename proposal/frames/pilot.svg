<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="What did the follow-up features add?" data-scene="pilot"><style>text{font-family:Arial,sans-serif}text[font-family]{font-family:Georgia,serif}</style><rect x="0" y="0" width="1920" height="1080" fill="#0b0f14"></rect><text x="120" y="87" font-size="23" fill="#98a8b7" text-anchor="start">FEATURE ENGINEERING / 05</text><text x="120" y="174" font-size="62" fill="#e8eef1" text-anchor="start" font-family="Georgia,serif" data-fit="1420">What did the follow-up features add?</text><text x="120" y="245" font-size="27" fill="#98a8b7" text-anchor="start" data-fit="1410">Historical follow-up • May + July 2021 • no public scores for these pilot variants</text><text x="120" y="326" font-size="23" fill="#98a8b7" text-anchor="start">ADDITIONS EXPLORED</text><g opacity="1" transform="translate(0 0)"><circle cx="145" cy="399" r="5" fill="#76aafa"></circle><text x="175" y="410" font-size="32" fill="#e8eef1" text-anchor="start">Longer funds history</text></g><g opacity="1" transform="translate(0 0)"><circle cx="145" cy="479" r="5" fill="#76aafa"></circle><text x="175" y="490" font-size="32" fill="#e8eef1" text-anchor="start">Usage changes</text></g><g opacity="1" transform="translate(0 0)"><circle cx="145" cy="559" r="5" fill="#76aafa"></circle><text x="175" y="570" font-size="32" fill="#e8eef1" text-anchor="start">Monetary ranks</text></g><g opacity="1" transform="translate(0 0)"><circle cx="145" cy="639" r="5" fill="#76aafa"></circle><text x="175" y="650" font-size="32" fill="#e8eef1" text-anchor="start">Prior-only EMA</text></g><line x1="710" y1="330" x2="710" y2="787" stroke="#30404d" stroke-width="2"></line><g opacity="1" transform="translate(0 0)"><text x="790" y="403" font-size="35" fill="#70d4bc" text-anchor="start">Longer funds history</text><text x="790" y="451" font-size="30" fill="#e8eef1" text-anchor="start">Improved in both months</text></g><g opacity="1" transform="translate(0 0)"><tex