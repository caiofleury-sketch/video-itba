<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Nine ways to reveal the context" data-scene="features"><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter><radialGradient id="background"><stop offset="0" stop-color="#12212a"></stop><stop offset="1" stop-color="#0b0f14"></stop></radialGradient></defs><style>text{font-family:Arial,sans-serif}text[font-family]{font-family:Georgia,serif}</style><rect x="0" y="0" width="1920" height="1080" fill="url(#background)"></rect><text x="120" y="86" font-size="22" fill="#9daebb" text-anchor="start">FEATURE ENGINEERING / THE CONTEXT BEHIND THE NUMBER</text><text x="120" y="174" font-size="61" fill="#e8eef1" text-anchor="start" font-family="Georgia,serif" data-fit="1420">Nine ways to reveal the context</text><text x="120" y="244" font-size="27" fill="#9daebb" text-anchor="start" data-fit="1420">Illustrative balances and activity counts—not measured experiment results.</text><text x="150" y="322" font-size="44" fill="#6cdbba" text-anchor="start" data-fit="1130">Relative usage</text><text x="150" y="401" font-size="47" fill="#6cdbba" text-anchor="start" data-fit="1120">6 vs usual 12 → −50%</text><circle cx="230" cy="550" r="14" fill="#6cdbba"></circle><circle cx="230" cy="670" r="14" fill="#6cdbba" opacity="1"></circle><circle cx="294" cy="550" r="14" fill="#6cdbba"></circle><circle cx="294" cy="670" r="14" fill="#6cdbba" opacity="1"></circle><circle cx="358" cy="550" r="14" fill="#6cdbba"></circle><circle cx="358" cy="670" r="14" fill="#6cdbba" opacity="1"></circle><circle cx="422" cy="550" r="14" fill="#6cdbba"></circle><circle cx="422" cy="670" r="14" fill="#6cdbba" opacity="1"></circle><circle cx="486" cy="550" r="14" fill="#6cdbba"></circle><circle cx="486" cy="670" r="14" fill="#6cdbba" opacity="1"></circle><circle cx="550" cy="550" r="14" fill="#6cdbba"></circle><circle cx="550" cy="670" r="14" fill="#6cdbba" opacity="1"></circle><circle cx="614" cy="550" r="14" fill="#6cdbba"></circle><circle cx="614" cy="670" r="14" fill="#6cdbba" opacity="0"></circle><circle cx="678" cy="550" r="14" fill="#6cdbba"></circle><circle cx="678" cy="670" r="14" fill="#6cdbba" opacity="0"></circle><circle cx="742" cy="550" r="14" fill="#6cdbba"></circle><circle cx="742" cy="670" r="14" fill="#6cdbba" opacity="0"></circle><circle cx="806" cy="550" r="14" fill="#6cdbba"></circle><circle cx="806" cy="670" r="14" fill="#6cdbba" opacity="0"></circle><circle cx="870" cy="550" r="14" fill="#6cdbba"></circle><circle cx="870" cy="670" r="14" fill="#6cdbba" opacity="0"></circle><circle cx="934" cy="550" r="14" fill="#6cdbba"></circle><circle cx="934" cy="670" r="14" fill="#6cdbba" opacity="0"></circle><text x="1140" y="560" font-size="32" fill="#9daebb" text-anchor="middle">Usual 12</text><text x="1140" y="680" font-size="38" fill="#6cdbba" text-anchor="middle">Now 6</text><text x="150" y="832" font-size="32" fill="#e8eef1" text-anchor="start" data-fit="1130">Make disengagement visible in activity.</text><line x1="1340" y1="300" x2="1340" y2="850" stroke="#2b3c4a" stroke-width="1"></line><circle cx="1388" cy="319" r="4" fill="#78abff"></circle><text x="1406" y="324" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Last-month values</text><text x="1406" y="347" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Last month’s value</text><circle cx="1388" cy="376" r="4" fill="#f3b773"></circle><text x="1406" y="381" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Monthly changes</text><text x="1406" y="404" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Current minus last month</text><circle cx="1388" cy="433" r="4" fill="#78abff"></circle><text x="1406" y="438" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Three-month averages</text><text x="1406" y="461" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Mean of prior 3 months</text><circle cx="1388" cy="490" r="4" fill="#6cdbba"></circle><text x="1406" y="495" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Relative funds · 3 months</text><text x="1406" y="518" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Balance/payroll vs own mean</text><circle cx="1388" cy="547" r="4" fill="#ec8aa6"></circle><text x="1406" y="552" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Card utilization</text><text x="1406" y="575" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Card balance ÷ credit limit</text><circle cx="1388" cy="604" r="4" fill="#6cdbba"></circle><text x="1406" y="609" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Relative funds · 6 months</text><text x="1406" y="632" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Relative funds over 6 months</text><rect x="1370" y="638" width="420" height="52" fill="#6cdbba" opacity=".09" rx="6"></rect><circle cx="1388" cy="661" r="6" fill="#6cdbba"></circle><text x="1406" y="666" font-size="22" fill="#6cdbba" text-anchor="start" data-fit="370">Relative usage</text><text x="1406" y="689" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Usage vs own 3-month mean</text><circle cx="1388" cy="718" r="6" fill="#2b3c4a"></circle><text x="1406" y="723" font-size="22" fill="#9daebb" text-anchor="start" data-fit="370">Monetary ranks</text><circle cx="1388" cy="775" r="6" fill="#2b3c4a"></circle><text x="1406" y="780" font-size="22" fill="#9daebb" text-anchor="start" data-fit="370">Recent-weighted history</text><line x1="120" y1="874" x2="1790" y2="874" stroke="#2b3c4a" stroke-width="2"></line><text x="120" y="926" font-size="33" fill="#e8eef1" text-anchor="start" data-fit="1660">Watch the construction; keep the definition as it joins the feature map.</text></svg>