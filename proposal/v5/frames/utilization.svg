<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Nine ways to reveal the context" data-scene="features"><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter><radialGradient id="background"><stop offset="0" stop-color="#12212a"></stop><stop offset="1" stop-color="#0b0f14"></stop></radialGradient></defs><style>text{font-family:Arial,sans-serif}text[font-family]{font-family:Georgia,serif}</style><rect x="0" y="0" width="1920" height="1080" fill="url(#background)"></rect><text x="120" y="86" font-size="22" fill="#9daebb" text-anchor="start">FEATURE ENGINEERING / THE CONTEXT BEHIND THE NUMBER</text><text x="120" y="174" font-size="61" fill="#e8eef1" text-anchor="start" font-family="Georgia,serif" data-fit="1420">Nine ways to reveal the context</text><text x="120" y="244" font-size="27" fill="#9daebb" text-anchor="start" data-fit="1420">Illustrative balances and activity counts—not measured experiment results.</text><text x="150" y="322" font-size="44" fill="#ec8aa6" text-anchor="start" data-fit="1130">Card utilization</text><text x="150" y="401" font-size="47" fill="#ec8aa6" text-anchor="start" data-fit="1120">80 ÷ 100 = 80%</text><circle cx="630" cy="595" r="126" fill="none" stroke="#2b3c4a" stroke-width="20"></circle><circle cx="630" cy="595" r="126" fill="none" stroke="#ec8aa6" stroke-width="20" stroke-dasharray="633.3450789637023 791.6813487046279" transform="rotate(-90 630 595)"></circle><text x="630" y="613" font-size="64" fill="#ec8aa6" text-anchor="middle">80%</text><text x="1000" y="550" font-size="34" fill="#e8eef1" text-anchor="middle">Balance 80</text><text x="1000" y="620" font-size="34" fill="#9daebb" text-anchor="middle">Limit 100</text><text x="150" y="832" font-size="32" fill="#e8eef1" text-anchor="start" data-fit="1130">Express the balance relative to capacity.</text><line x1="1340" y1="300" x2="1340" y2="850" stroke="#2b3c4a" stroke-width="1"></line><circle cx="1388" cy="319" r="4" fill="#78abff"></circle><text x="1406" y="324" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Last-month values</text><text x="1406" y="347" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Last month’s value</text><circle cx="1388" cy="376" r="4" fill="#f3b773"></circle><text x="1406" y="381" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Monthly changes</text><text x="1406" y="404" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Current minus last month</text><circle cx="1388" cy="433" r="4" fill="#78abff"></circle><text x="1406" y="438" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Three-month averages</text><text x="1406" y="461" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Mean of prior 3 months</text><circle cx="1388" cy="490" r="4" fill="#6cdbba"></circle><text x="1406" y="495" font-size="22" fill="#e8eef1" text-anchor="start" data-fit="370">Relative funds · 3 months</text><text x="1406" y="518" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Balance/payroll vs own mean</text><rect x="1370" y="524" width="420" height="52" fill="#ec8aa6" opacity=".09" rx="6"></rect><circle cx="1388" cy="547" r="6" fill="#ec8aa6"></circle><text x="1406" y="552" font-size="22" fill="#ec8aa6" text-anchor="start" data-fit="370">Card utilization</text><text x="1406" y="575" font-size="19" fill="#9daebb" text-anchor="start" data-fit="370">Card balance ÷ credit limit</text><circle cx="1388" cy="604" r="6" fill="#2b3c4a"></circle><text x="1406" y="609" font-size="22" fill="#9daebb" text-anchor="start" data-fit="370">Relative funds · 6 months</text><circle cx="1388" cy="661" r="6" fill="#2b3c4a"></circle><text x="1406" y="666" font-size="22" fill="#9daebb" text-anchor="start" data-fit="370">Relative usage</text><circle cx="1388" cy="718" r="6" fill="#2b3c4a"></circle><text x="1406" y="723" font-size="22" fill="#9daebb" text-anchor="start" data-fit="370">Monetary ranks</text><circle cx="1388" cy="775" r="6" fill="#2b3c4a"></circle><text x="1406" y="780" font-size="22" fill="#9daebb" text-anchor="start" data-fit="370">Recent-weighted history</text><line x1="120" y1="874" x2="1790" y2="874" stroke="#2b3c4a" stroke-width="2"></line><text x="120" y="926" font-size="33" fill="#e8eef1" text-anchor="start" data-fit="1660">Watch the construction; keep the definition as it joins the feature map.</text></svg>