<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Our first addition: personal-relative funds" data-scene="takeaway"><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter><radialGradient id="background"><stop offset="0" stop-color="#12212a"></stop><stop offset="1" stop-color="#0b0f14"></stop></radialGradient></defs><style>text{font-family:Arial,sans-serif}text[font-family]{font-family:Georgia,serif}</style><rect x="0" y="0" width="1920" height="1080" fill="url(#background)"></rect><text x="120" y="86" font-size="22" fill="#9daebb" text-anchor="start">FEATURE ENGINEERING / THE CONTEXT BEHIND THE NUMBER</text><text x="120" y="174" font-size="61" fill="#e8eef1" text-anchor="start" font-family="Georgia,serif" data-fit="1420">Our first addition: personal-relative funds</text><text x="120" y="244" font-size="27" fill="#9daebb" text-anchor="start" data-fit="1420">The strongest package in the controlled screen—not yet a confirmed public-profit gain.</text><g opacity="1" transform="translate(0 0)"><g transform="translate(145 380) scale(2.6)"><line x1="2" y1="54" x2="47" y2="54" stroke="#2b3c4a" stroke-width="1.4"></line><line x1="61" y1="54" x2="106" y2="54" stroke="#2b3c4a" stroke-width="1.4"></line><rect x="8" y="10" width="13" height="44" fill="#6cdbba" opacity=".4"></rect><rect x="27" y="23" width="13" height="31" fill="#6cdbba"></rect><rect x="66" y="10" width="13" height="44" fill="#6cdbba" opacity=".4"></rect><rect x="85" y="14" width="13" height="40" fill="#6cdbba"></rect><polyline points="45,2 53,2 53,9" fill="none" stroke="#6cdbba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></g><text x="620" y="377" font-size="24" fill="#6cdbba" text-anchor="start">ADD FIRST</text><text x="620" y="447" font-size="52" fill="#6cdbba" text-anchor="start" data-fit="1120">Relative balance + payroll</text></g><g opacity="1" transform="translate(0 0)"><text x="620" y="510" font-size="31" fill="#e8eef1" text-anchor="start">Against each customer’s own prior 3-month mean</text></g><g opacity="1" transform="translate(0 0)"><text x="620" y="579" font-size="32" fill="#9daebb" text-anchor="start">2 relative changes + 2 near-zero flags</text></g><g opacity="1" transform="translate(0 0)"><line x1="120" y1="653" x2="1780" y2="653" stroke="#2b3c4a" stroke-width="2"></line><text x="120" y="715" font-size="38" fill="#e8eef1" text-anchor="start">Then verify the incremental profit in matched tests.</text></g><g opacity="1" transform="translate(0 0)"><text x="120" y="818" font-size="29" fill="#9daebb" text-anchor="start">Next candidates: 6-month funds history and relative usage.</text></g><line x1="120" y1="874" x2="1790" y2="874" stroke="#2b3c4a" stroke-width="2"></line><text x="120" y="926" font-size="33" fill="#e8eef1" text-anchor="start" data-fit="1660">Recommendation: personal-relative funds. Profit confirmation pending.</text></svg>